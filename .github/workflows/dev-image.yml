# Builds the dev image (docker/dev/Dockerfile) and publishes it to GHCR under the hash of its
# inputs (scripts/dev-image-tag.sh), so manage.sh pulls it instead of building. A registry probe
# skips the build when that tag exists. Built with the default user IDs (1000:1000); manage.sh
# builds locally on a machine whose IDs differ.
name: dev image

on:
  push:
    branches: [main]
    paths: [docker/dev/**, scripts/dev-image-tag.sh, .github/workflows/dev-image.yml]
  workflow_dispatch:

concurrency:
  group: dev-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/adyansh04/piper-stack-dev

jobs:
  dev-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - id: tag
        run: echo "ref=${IMAGE}:$(./scripts/dev-image-tag.sh)" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: probe
        run: |
          if docker manifest inspect "${{ steps.tag.outputs.ref }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # The runner starts with about 20 GB free; CUDA, TensorRT and MoveIt unpack to more.
      - if: steps.probe.outputs.exists == 'false'
        name: Make room for the image
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af
          df -h /

      - if: steps.probe.outputs.exists == 'false'
        run: docker build -t "${{ steps.tag.outputs.ref }}" docker/dev

      - if: steps.probe.outputs.exists == 'false'
        name: Check the image holds the toolchain and the stack's ROS packages
        run: |
          docker run --rm "${{ steps.tag.outputs.ref }}" bash -c '
            set -e
            g++ --version | head -1
            nvcc --version | tail -1
            source /opt/ros/lyrical/setup.bash
            for p in moveit_ros_move_group moveit_servo pick_ik behaviortree_cpp rosbag2_storage_mcap; do
              ros2 pkg prefix "$p" >/dev/null
            done'

      - if: steps.probe.outputs.exists == 'false'
        run: docker push "${{ steps.tag.outputs.ref }}"
