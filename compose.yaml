# The dev container: build, tests and the ROS 2 Lyrical stack, in sim or on the real arm. Run it
# through scripts/manage.sh, which sets HOST_UID, HOST_GID and DEV_IMAGE_TAG.
name: piper-stack

services:
  dev:
    image: ghcr.io/adyansh04/piper-stack-dev:${DEV_IMAGE_TAG:-local}
    build:
      context: docker/dev
      # The host's resolver: the default build network cannot resolve names behind a VPN.
      network: host
      args:
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
    container_name: piper-dev
    init: true
    tty: true
    stdin_open: true
    # A crashed driver never comes back on its own, and a stop gets time to deactivate in order.
    restart: "no"
    stop_grace_period: 30s
    # Host network: DDS with the sim container, and the CAN interface of the arm.
    network_mode: host
    ipc: host
    # SCHED_FIFO and locked memory for the controller_manager on the real arm.
    cap_add: [SYS_NICE]
    ulimits:
      rtprio: 99
      memlock: -1
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-42}
      RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
      ROS_AUTOMATIC_DISCOVERY_RANGE: LOCALHOST
      PIPER_CAN: ${PIPER_CAN:-can_follower}
      DISPLAY: ${DISPLAY:-:0}
      QT_X11_NO_MITSHM: "1"
      NVIDIA_DRIVER_CAPABILITIES: all
      CCACHE_DIR: /home/ubuntu/.cache/ccache
    volumes:
      - type: bind
        source: .
        target: /piper-stack
      - type: bind
        source: /tmp/.X11-unix
        target: /tmp/.X11-unix
      - type: volume
        source: ccache
        target: /home/ubuntu/.cache/ccache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, compute, utility, graphics, display]

volumes:
  ccache:
