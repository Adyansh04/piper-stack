controller_manager:
  ros__parameters:
    # The arm sends joint feedback at 200 Hz (measured 7 Nov 2026).
    update_rate: 200
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    gripper_controller:
      type: parallel_gripper_action_controller/GripperActionController
    policy_controller:
      type: piper_controllers/PolicyController

joint_state_broadcaster:
  ros__parameters:
    # joint8 follows joint7 through its URDF mimic in robot_state_publisher.
    joints: [joint1, joint2, joint3, joint4, joint5, joint6, joint7]
    interfaces: [position, velocity, effort]

arm_controller:
  ros__parameters:
    joints: [joint1, joint2, joint3, joint4, joint5, joint6]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    # The firmware interpolates every target at its own speed scaling, so the arm lags the
    # trajectory; a goal is judged at its end, with this much time to settle, in s.
    constraints:
      goal_time: 5.0
      stopped_velocity_tolerance: 0.02
    # MoveIt Servo streams short trajectories that end moving; MoveIt's own end at rest.
    allow_nonzero_velocity_at_trajectory_end: true

gripper_controller:
  ros__parameters:
    joint: joint7
    state_interfaces: [position, velocity]
    # How close to the target counts as reached, in m of one finger's travel.
    goal_tolerance: 0.002
    # Fingers stopped on an object are a grasp, not a failure: slower than the threshold (m/s) for
    # stall_timeout (s) ends the goal. A finger pressing on an object jitters at 1-3 mm/s in the
    # simulator's contacts.
    allow_stalling: true
    stall_timeout: 1.0
    stall_velocity_threshold: 0.005

# A trained reach policy (piper_controllers), spawned inactive with bringup's policy:=<onnx file>.
# The reach task in lab/ trains with these values (it reads this section), so a policy and this
# controller always agree.
policy_controller:
  ros__parameters:
    joints: [joint1, joint2, joint3, joint4, joint5, joint6]
    # Set by the launch (policy:=).
    model_path: ""
    # The frame of the targets on ~/target_pose: the robot's base.
    frame: "base_link"
    # Policy steps a second; the update rate (200 Hz) must be a whole multiple.
    policy_rate_hz: 50.0
    # Wanted joint positions at a zero action (rad: SRDF ready), and their change per unit of
    # action (rad).
    action_offset: [0.0, 1.32, -1.14, 0.0, 1.1, 0.0]
    action_scale: 0.5
    # Caps of the commanded joint motion: a third of the firmware's 3 rad/s, in rad/s, and the
    # firmware's own acceleration cap, in rad/s^2.
    max_velocity: 1.0
    max_acceleration: 0.5
