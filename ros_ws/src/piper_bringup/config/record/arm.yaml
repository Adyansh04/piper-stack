# Recording profile `arm` (record.launch.py): the arm's state and commands, the control loop's
# timing (the hardware's read and write periodicity is the CAN feedback's) and the estimator.
/**/recorder:
  ros__parameters:
    record:
      topics:
        - /joint_states
        - /arm_controller/controller_state
        - /arm_controller/joint_trajectory
        - /controller_manager/statistics/names
        - /controller_manager/statistics/values
        - /diagnostics
        - /robot_description
        - /tf
        - /tf_static
        - /state_estimator/tcp_wrench
        - /state_estimator/grasped
        # The simulator's side of the joint loop (hardware:=isaac) and its clock.
        - /isaac_joint_commands
        - /isaac_joint_states
        - /clock
      actions: [/gripper_controller/gripper_cmd]
      # Latched topics whose last message goes into every file of a split bag.
      repeat_transient_local: [/robot_description, /tf_static]
    storage:
      storage_id: "mcap"
      # zstd chunk compression, fast enough for the 200 Hz loop.
      storage_preset_profile: "zstd_fast"
