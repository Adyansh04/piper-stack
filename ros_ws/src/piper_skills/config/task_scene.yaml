# task_scene: a task's parts in MoveIt's planning scene. Lengths in metres, angles in radians.
/**/task_scene:
  ros__parameters:
    # The task's task.yaml (tasks/<task>/), whose meshes are relative to it: set by the launch
    # file's task_file argument.
    task_file: ""
    # The parts' poses (tf2_msgs/TFMessage, child frame = the part's name): Isaac Sim's ground
    # truth, every 0.5 s of simulation time.
    poses_topic: "/sim/objects"
    # MoveIt's planning frame; poses in any other frame are ignored.
    planning_frame: "world"
    # A held part is attached to this link and may touch these, the gripper's (as skills.yaml's
    # gripper.touch_links).
    tcp_link: "tcp"
    touch_links: [gripper_base, link6, link7, link8]
    # A part is moved in the scene once its pose changed by more than 1 mm or 0.01 rad.
    position_tolerance_m: 0.001
    angle_tolerance_rad: 0.01
    # How often the scene catches up with the poses, seconds.
    update_period_s: 0.5
