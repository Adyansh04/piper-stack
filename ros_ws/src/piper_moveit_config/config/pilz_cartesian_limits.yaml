# Cartesian limits of Pilz's LIN and CIRC motions, for the tcp: m/s, m/s^2, rad/s. Low because a
# straight line near the folded wrist asks joint3 for about 7 times the tcp's acceleration, and the
# firmware caps the joints at 0.5 rad/s^2: a 5 cm approach takes about 2 s.
cartesian_limits:
  max_trans_vel: 0.1
  max_trans_acc: 0.05
  max_trans_dec: -0.05
  max_rot_vel: 0.5
