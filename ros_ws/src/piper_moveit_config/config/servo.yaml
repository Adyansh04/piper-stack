# MoveIt Servo: real-time jogging of the arm from twists or joint jogs (keyboard, gamepad, a
# policy), checked for collisions, singularities and joint limits, streamed to the arm controller.
servo_node:
  ros__parameters:
    # Low-pass strength of the command filter: higher is smoother and slower to respond.
    butterworth_filter_coeff: 1.5
    moveit_servo:
      move_group_name: arm
      # 100 Hz out; the controller runs at 200 Hz.
      publish_period: 0.01
      max_expected_latency: 0.1
      # Twists in m/s and rad/s, joint jogs in rad/s.
      command_in_type: speed_units
      scale:
        linear: 0.2
        rotational: 0.8
        joint: 0.5
      # Stops when commands stop for this long (a released key, a dead input node), in s.
      incoming_command_timeout: 0.2
      command_out_type: trajectory_msgs/JointTrajectory
      command_out_topic: /arm_controller/joint_trajectory
      publish_joint_positions: true
      publish_joint_velocities: true
      publish_joint_accelerations: false
      joint_topic: /joint_states
      # move_group owns the planning scene; Servo follows the full scene it publishes, objects,
      # octomap and robot state included.
      is_primary_planning_scene_monitor: false
      monitored_planning_scene_topic: /monitored_planning_scene
      # A low-pass filter on the joint commands; the acceleration-limited filter holds the arm
      # still under the firmware's 0.5 rad/s^2 cap (Servo restarts each step from rest).
      use_smoothing: true
      smoothing_filter_plugin_name: online_signal_smoothing::ButterworthFilterPlugin
      check_collisions: true
      collision_check_rate: 10.0
      # Slows down from these distances to a collision, in m.
      self_collision_proximity_threshold: 0.01
      scene_collision_proximity_threshold: 0.02
      lower_singularity_threshold: 17.0
      hard_stop_singularity_threshold: 30.0
      leaving_singularity_threshold_multiplier: 2.0
      # Kept off the joint limits by this much, in rad: two cycles at the policies' 1 rad/s cap.
      # Wider halts work poses (joint5 is 0.12 rad from its limit at ready). The policy runner keeps
      # its targets further in (limit_margin_rad).
      joint_limit_margins: [0.02]
      apply_twist_commands_about_ee_frame: true
